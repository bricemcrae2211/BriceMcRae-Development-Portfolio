
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Advertisement</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {

            width: 100%;
            height: 100%;

            font-family: Arial, sans-serif;

            background: transparent;

        }

        body {

            padding: 5px;

        }

        .ad-box {

            width: 100%;
            height: 100%;
            min-height: 250px;

            display: flex;

            justify-content: center;
            align-items: center;

            background: #151515;

            border: 1px solid #444;

            border-radius: 8px;

        }

        .ad-placeholder {

            width: 100%;
            padding: 15px;

            display: flex;

            justify-content: center;
            align-items: center;

            color: #777;

            font-size: 14px;

            text-align: center;

        }

    </style>

</head>

<body>

    <div class="ad-box">

        <div class="ad-placeholder">

            Ad Space

        </div>

    </div>

</body>

</html>
