
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Demo Reel</title>

    <link rel="stylesheet" href="demo-reel.css">

</head>

<body>

    <main class="demo-reel-page">

        <!-- COVER PHOTO HEADER -->

        <header class="demo-reel-header" id="demoReelHeader">

            <div class="cover-photo-overlay"></div>

            <div class="demo-reel-heading">

                <!-- CATEGORY -->

                <div
                    class="demo-reel-eyebrow"
                    data-editable="true">

                    GAME DEVELOPMENT &amp; PROGRAMMING

                </div>

                <!-- TITLE -->

                <div class="demo-reel-title-group">

                    <h1
                        class="video-title"
                        data-editable="true">

                        Demo Reel

                    </h1>

                    <div class="demo-reel-title-line"></div>

                </div>

                <!-- DESCRIPTION -->

                <div
                    class="demo-reel-description-area"
                    id="demoReelDescriptionArea">

                    <div class="description-accent"></div>

                    <p
                        class="demo-reel-subtitle"
                        id="demoReelDescription"
                        data-editable="true">

                        A showcase of my development work,
                        technical skills, and creative projects.

                    </p>

                </div>

            </div>

            <!-- COVER PHOTO -->

            <img
                class="demo-reel-cover-image"
                src="../cover-photo/demo-reel-cover.jpg"
                alt="Demo reel cover photo">

        </header>

        <!-- FEATURED VIDEO -->

        <section class="demo-reel-video-section">

            <div class="video-section-heading">

                <span>FEATURED VIDEO</span>

                <span class="video-format-label">
                    MP4
                </span>

            </div>

            <!-- VIDEO PLAYER -->

            <div class="video-container">

                <video
                    id="demoReelVideo"
                    controls
                    playsinline
                    preload="metadata">

                    <source
                        src="../videos/demo-reel.mp4"
                        type="video/mp4">

                    Your browser does not support HTML5 video.

                </video>

            </div>

        </section>

        <!-- VIDEO INFORMATION DROPDOWN -->

        <section class="demo-reel-information-section">

            <details class="video-information-dropdown">

                <summary class="video-information-heading">

                    <span>VIDEO INFORMATION</span>

                    <span class="video-information-arrow"></span>

                </summary>

                <div class="video-information-content">

                    <p>Fill video info here.</p>

                </div>

            </details>

        </section>

    </main>

</body>

</html>
