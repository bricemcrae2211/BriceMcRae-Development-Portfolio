
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Account</title>

    <link rel="stylesheet" href="account.css">

    <style>

        /* =========================================
           ACCOUNT VISIBILITY
        ========================================= */

        [hidden] {
            display: none !important;
        }

        /* =========================================
           TRANSPARENT BACKGROUND
        ========================================= */

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
            background: transparent !important;
        }

        body {
            overflow-x: hidden;
        }

        /* =========================================
           ACCOUNT CONTAINER
        ========================================= */

        .account-container {
            position: relative;
            width: 100%;
            min-height: 100vh;
            background: transparent !important;
        }

        /* =========================================
           CLOSE BUTTON
        ========================================= */

        .close-account {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 100;

            display: flex;
            align-items: center;
            justify-content: center;

            width: 35px;
            height: 35px;

            color: white;
            background: rgba(40, 40, 40, 0.8);

            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;

            font-size: 20px;
            font-weight: bold;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease,
                border-color 0.2s ease;
        }

        .close-account:hover {
            background: #a83232;
            border-color: white;
            transform: scale(1.08);
        }

        .close-account:active {
            transform: scale(0.95);
        }

        /* =========================================
           ACCOUNT SECTIONS
        ========================================= */

        #signInSection,
        #signUpSection,
        #adminSignUpSection {
            width: 100%;
        }

    </style>

</head>

<body>

    <div class="account-container">

        <!-- EXIT BUTTON -->

        <button
            id="closeAccount"
            class="close-account"
            type="button"
            aria-label="Close account window">

            X

        </button>


        <!-- SIGN IN -->

        <div id="signInSection">

            <h1>Sign In</h1>

            <p>Welcome back. Sign in to your account.</p>

            <form id="signInForm" novalidate onsubmit="return false;">

                <input
                    type="text"
                    id="signInEmail"
                    placeholder="Username or Email Address"
                    autocomplete="username">

                <input
                    type="password"
                    id="signInPassword"
                    placeholder="Password"
                    autocomplete="current-password">

                <button
                    type="button"
                    class="account-button">

                    Sign In

                </button>

            </form>

            <div class="account-switch">

                <span>Don't have an account?</span>

                <button
                    id="showSignUp"
                    type="button">

                    Sign Up

                </button>

            </div>

        </div>


        <!-- NORMAL SIGN UP -->

        <div id="signUpSection" hidden>

            <h1>Create Account</h1>

            <p>Create your personal account.</p>

            <form id="signUpForm" novalidate>

                <input
                    type="text"
                    id="signUpUsername"
                    placeholder="Username"
                    autocomplete="username">

                <input
                    type="email"
                    id="signUpEmail"
                    placeholder="Email Address"
                    autocomplete="email">

                <input
                    type="password"
                    id="signUpPassword"
                    placeholder="Your Password"
                    autocomplete="new-password">

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm Your Password"
                    autocomplete="new-password">

                <button
                    type="submit"
                    class="account-button">

                    Create Account

                </button>

            </form>

            <button
                id="showAdminSignUp"
                class="admin-account-button"
                type="button">

                Create Admin Account

            </button>

            <div class="account-switch">

                <span>Already have an account?</span>

                <button
                    id="showSignIn"
                    type="button">

                    Sign In

                </button>

            </div>

        </div>


        <!-- ADMIN SIGN UP -->

        <div id="adminSignUpSection" hidden>

            <h1>Create Admin Account</h1>

            <p>Enter the initial admin setup password.</p>

            <form id="adminSignUpForm" novalidate>

                <input
                    type="password"
                    id="adminSetupPassword"
                    placeholder="Initial Admin Setup Password"
                    autocomplete="off">

                <input
                    type="text"
                    id="adminUsername"
                    placeholder="Username"
                    autocomplete="username">

                <input
                    type="email"
                    id="adminEmail"
                    placeholder="Email Address"
                    autocomplete="email">

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Your Password"
                    autocomplete="new-password">

                <input
                    type="password"
                    id="adminConfirmPassword"
                    placeholder="Confirm Your Password"
                    autocomplete="new-password">

                <button
                    type="submit"
                    class="account-button">

                    Create Admin Account

                </button>

            </form>

            <div class="account-switch">

                <span>Want a normal account?</span>

                <button
                    id="backToSignUp"
                    type="button">

                    Create Account

                </button>

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->
    <script src="../js/account/set-sign-in.js"></script>
     
    <script src="../js/sign-in.js"></script>
    <script src="../js/account/sign-up.js"></script>
    <script src="../js/account/account.js"></script>
    <script src="../js/exit.js"></script>

</body>

</html>
